name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Télécharger le projet
        uses: actions/checkout@v4

      - name: Installer Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ouvrir le projet
        run: |
          rm -rf android-project
          mkdir android-project
          unzip PHARMACOPEE_BEFO_INTERNATIONAL_SOURCE.zip -d android-project

      - name: Construire APK
        run: |
          cd android-project
          gradle assembleDebug

      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: PHARMACOPEE-BEFO-INTERNATIONAL-APK
          path: android-project/app/build/outputs/apk/debug/*.apk
